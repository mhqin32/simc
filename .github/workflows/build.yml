name: Build simc.exe

on:
  push:
    branches: [ midnight ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Setup MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (no GUI)
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF

      - name: Build simc.exe
        run: cmake --build build --config Release --target simc

      - name: Upload simc.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: simc-exe
          path: |
          build/simc.exe
      build/**/*.exe
