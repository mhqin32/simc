name: Build simc.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: microsoft/setup-msvc@v1

      - name: Install CMake
        uses: lukka/get-cmake@v3
        with:
          cmakeVersion: "latest"

      - name: Configure build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build simc.exe
        run: |
          cmake --build build --config Release --target simc

      - name: Upload simc.exe artifact
        uses: actions/upload-artifact@v3
        with:
          name: simc-exe
          path: build/Release/simc.exe
